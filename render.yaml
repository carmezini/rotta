databases:
  - name: rotta-db
    plan: free
    region: virginia
    databaseName: rotta
    user: rotta

services:
  - type: web
    name: rotta-api
    runtime: go
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags "-s -w" -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rotta-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: rotta-web
    runtime: node
    plan: free
    region: virginia
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
